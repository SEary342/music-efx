[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-efx"
version = "0.1.1"
description = "A TUI MP3 Player"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "just-playback>=0.1.8",
    "textual>=8.2.7",
    "tinytag>=2.2.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "taskipy>=1.14",
]

[project.scripts]
music-efx = "src.main:main"

###############################################################################
# Ruff
###############################################################################

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.coverage.run]
source = ["music_efx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

###############################################################################
# Taskipy
###############################################################################

[tool.taskipy.tasks]
test = "pytest"
cov = "pytest --cov=music_efx --cov-report=term-missing"
cov-html = "pytest --cov=music_efx --cov-report=html"

lint = "ruff check ."

fix = "ruff check . --fix"

format = "ruff format ."

check = """
task lint
task format
task cov
"""

build = "pyinstaller src/music_efx/__main__.py --name music-efx --onefile --collect-all cffi --collect-all just_playback"

mac-app = "./scripts/build_mac.sh"
mac-install = "./scripts/build_mac.sh --install"
mac-deploy = "task build && task mac-install"

all = "task check && task build"

clean = """
python -c "import pathlib, shutil; \
[shutil.rmtree(p, ignore_errors=True) for p in ['build','dist','.pytest_cache','.ruff_cache']]; \
[pathlib.Path(f).unlink(missing_ok=True) for f in pathlib.Path('.').glob('*.spec')]"
"""

###############################################################################
# PyInstaller
###############################################################################

[tool.pyinstaller]
name = "music-efx"
